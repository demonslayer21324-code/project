<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfume Reviews</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Perfume Reviews</h1>

    <div class="review-form">
        <h2>Add Your Review</h2>
        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="perfume" placeholder="Perfume Name">
        <textarea id="review" placeholder="Your Review"></textarea>
        <button id="submitBtn">Submit Review</button>
        <p id="status"></p>
    </div>

    <div class="reviews">
        <h2>All Reviews</h2>
        <ul id="reviewsList">
            {% for r in reviews %}
            <li><strong>{{ r.name }}</strong> on <em>{{ r.perfume }}</em>: {{ r.review }}</li>
            {% endfor %}
        </ul>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
